<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9623b">
  <title>Ricettario</title>
  <meta name="description" content="Le tue ricette, i timer di cottura e la lista della spesa.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ricettario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">🍳</span><span>Ricettario</span></div>
    <nav class="tabs" aria-label="Sezioni">
      <button class="tab" data-act="tab" data-tab="ricette"><span class="ti">📖</span><span>Ricette</span></button>
      <button class="tab" data-act="tab" data-tab="piano"><span class="ti">🗓️</span><span>Piano</span></button>
      <button class="tab" data-act="tab" data-tab="spesa"><span class="ti">🛒</span><span>Spesa</span><em id="badge" hidden>0</em></button>
    </nav>
    <button class="icon-btn" data-act="backup" title="Backup e ripristino" aria-label="Backup e ripristino">⚙️</button>
  </div>
</header>

<main id="view"></main>

<button id="fab" class="fab" data-act="new" aria-label="Nuova ricetta"><span>＋</span><b>Nuova ricetta</b></button>

<div id="timers" class="timers" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<!-- Dettaglio ricetta -->
<dialog id="rv" class="sheet"></dialog>

<!-- Modifica ricetta -->
<dialog id="ed" class="sheet"></dialog>

<!-- Importa ricetta da link -->
<dialog id="im" class="sheet small"></dialog>

<!-- Scelta pasto per il piano -->
<dialog id="pk" class="sheet small"></dialog>

<!-- Condividi lista -->
<dialog id="sh" class="sheet small"></dialog>

<!-- Backup -->
<dialog id="bk" class="sheet small"></dialog>

<datalist id="units">
  <option value="g"><option value="kg"><option value="ml"><option value="l"><option value="cl">
  <option value="cucchiaio"><option value="cucchiaino"><option value="pizzico"><option value="pz">
  <option value="spicchio"><option value="foglia"><option value="bicchiere"><option value="tazza"><option value="q.b.">
</datalist>
<datalist id="cats"></datalist>

<script src="app.js"></script>
</body>
</html>
